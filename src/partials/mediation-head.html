<style>
@font-face{font-family:'Cormorant Garamond';src:url('/assets/fonts/cormorant-garamond-latin-500-normal.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url('/assets/fonts/cormorant-garamond-latin-600-normal.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
.page-hero--mediation{--mh-gold:#EED9A4;--mh-gold-deep:#EED9A4;background:linear-gradient(105deg,var(--n1) 0%,var(--n1) 40%,var(--n1b) 74%,var(--n1b) 100%);padding-bottom:clamp(4rem,8vw,7rem)}
.page-hero--mediation .hero__media{width:66%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 32%);mask-image:linear-gradient(90deg,transparent 0%,#000 32%)}
.page-hero--mediation .hero__media img{object-position:58% 22%}
.page-hero--mediation .hero__media::after{background:linear-gradient(90deg,rgba(10, 27, 49, 0.35),rgba(58,38,23,.05))}
.page-hero--mediation::before{background:linear-gradient(90deg,rgba(10, 27, 49, 0.88) 0%,rgba(10, 27, 49, 0.6) 36%,rgba(10, 27, 49, 0) 62%),linear-gradient(180deg,rgba(10, 27, 49, 0.55) 0%,rgba(10, 27, 49, 0) 26%,rgba(10, 27, 49, 0) 72%,rgba(10, 27, 49, 0.55) 100%)}
.mh__eyebrow{display:flex;flex-direction:column;align-items:flex-start;gap:.85rem;margin:0 0 1.6rem;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(1.05rem,.95rem + .45vw,1.4rem);letter-spacing:.42em;text-transform:uppercase;color:var(--t-head)}
.mh__name{padding-bottom:.85rem;border-bottom:1px solid rgba(238, 217, 164, 0.75)}
.mh__role{font-family:var(--sans);font-size:.75rem;font-weight:600;letter-spacing:.4em;color:var(--t-body)}
.page-hero--mediation .mh__title{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:500;font-size:clamp(2.7rem,1.4rem + 4vw,5.2rem);line-height:1.02;letter-spacing:-.005em;max-width:none;margin:0}
.mh__line{display:block}
.mh__gold{background:linear-gradient(90deg,var(--gold),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.mh__services{margin:1.8rem 0 0;font-size:.8rem;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--t-head)}
.page-hero--mediation .mh__services ul li{list-style:none}.mh__services ul{display:flex;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.mh__services ul+ul{margin-top:.6rem}
.mh__services li+li::before{content:'|';margin:0 .75rem;color:var(--t-label);font-weight:400}
@media (min-width:820px){.mh__line{white-space:nowrap}}
.page-hero--mediation .mh__lede{position:relative;margin-top:1.6rem;padding-top:1.6rem;max-width:34em;font-size:var(--step-0);color:var(--t-body)}
.mh__lede::before{content:'';position:absolute;top:0;left:0;width:130px;height:1px;background:linear-gradient(90deg,var(--mh-gold),rgba(238,217,164,.15))}
.page-hero--mediation .mh__cta{gap:1.1rem;min-height:56px;padding:1rem 1.75rem;border-radius:2px;border:1.5px solid var(--gold);background:var(--gold);color:var(--btn-ink);font-size:.82rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 16px 32px -18px rgba(0,0,0,.75)}
.page-hero--mediation .mh__cta:hover,.page-hero--mediation .mh__cta:focus-visible{background:var(--hl);color:var(--btn-ink);border-color:var(--hl);text-decoration:none}
.page-hero--mediation .mh__cta:focus-visible{outline:2px solid var(--cream);outline-offset:3px;border-radius:2px}
.mh__arrow{width:24px;height:12px;transition:transform .2s var(--ease)}
.mh__cta:hover .mh__arrow{transform:translateX(4px)}
.page-hero--mediation .jump{margin-top:2.25rem}
.page-hero--mediation .jump a{border-color:rgba(238, 217, 164, 0.45)}
@media (max-width:819px){.page-hero--mediation{background:var(--n1)}.page-hero--mediation .hero__media{width:100%;-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 100%);mask-image:linear-gradient(180deg,#000 50%,transparent 100%)}.page-hero--mediation .hero__media img{object-position:58% 0%}.page-hero--mediation::before{background:linear-gradient(180deg,rgba(10, 27, 49, 0.55) 0%,rgba(10, 27, 49, 0) 22%)}.mh__eyebrow{letter-spacing:.32em}.mh__services{font-size:.72rem;letter-spacing:.12em}.page-hero--mediation .mh__services ul li{list-style:none}.mh__services ul{gap:.45rem 1rem}.mh__services ul+ul{margin-top:.45rem}.mh__services li+li::before{content:none}}
</style>
