<style>.bento-wrap:has(.video-wrap){--video-gap:clamp(2.5rem,2rem + 1.5vw,3.5rem);padding-bottom:var(--video-gap)}.video-wrap{padding-top:var(--video-gap,3rem)}.video-cta{display:flex;justify-content:center;margin-top:var(--video-gap,2.5rem)}.yt-facade{position:relative;max-width:980px;margin:0 auto;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--n1);box-shadow:0 24px 48px -28px rgba(11,22,38,.55)}.yt-facade img,.yt-facade iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}.yt-facade__play{position:absolute;inset:0;display:grid;place-items:center;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:pointer}.yt-facade__play svg{width:76px;height:54px;transition:transform .2s}.yt-facade__play:hover svg,.yt-facade__play:focus-visible svg{transform:scale(1.08)}.yt-facade__play:hover svg path:first-child{fill:#c4302b;fill-opacity:1}.yt-facade__play:focus-visible{outline:3px solid var(--gold);outline-offset:-6px}.yt-facade__fallback{position:absolute;left:50%;bottom:1rem;transform:translateX(-50%);color:var(--t-head)}</style>
